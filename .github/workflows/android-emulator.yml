name: Android emulator

# Builds the Android app and drives it on a KVM-accelerated emulator with
# Maestro. GitHub's ubuntu x86 runners expose /dev/kvm, which is what makes the
# emulator usable in CI; without it the emulator falls back to software
# emulation and effectively never boots.
#
# This is slow (native build plus emulator boot), so it is a separate workflow
# from ci.yml rather than another job in it.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and drive the app
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # No `cache: gradle` here: android/ is generated by prebuild further down,
      # so at this point there is no Gradle file to key a cache on and the
      # action fails outright.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: pnpm install --frozen-lockfile

      # android/ is generated, not committed, so CI regenerates it from app.json.
      - name: Generate the native project
        run: pnpm --filter @scrapbook-atlas/mobile exec expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      # The release variant embeds the JS bundle, so the APK is self-contained
      # and the flow does not depend on a Metro server staying alive. Expo's
      # template signs release with the debug keystore, so no secrets are needed.
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The runner ships /dev/kvm as root:kvm 0660 and the runner user is not in
      # the kvm group, so widen it before the emulator starts.
      - name: Grant access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run the Milestone 0 flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro/m0-placeholder.yaml \
              --format junit --output maestro-report.xml --debug-output maestro-debug

      - name: Upload the screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-m0
          path: |
            *.png
            maestro-report.xml
            maestro-debug/
          if-no-files-found: warn
