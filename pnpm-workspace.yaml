packages:
  - apps/*
  - packages/*

# These three ship prebuilt native binaries and need their install scripts to
# run: esbuild and unrs-resolver back vitest and eslint, @parcel/watcher backs
# Metro's file watching.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - prettier@3.9.10
